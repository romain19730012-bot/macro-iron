<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#1A0000"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.15" cy="0.6" r="0.6">
      <stop offset="0%" stop-color="#E60000" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#E60000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Eyebrow -->
  <g transform="translate(80, 130)">
    <rect x="0" y="14" width="48" height="3" fill="#E60000"/>
    <text x="64" y="20" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#E60000" letter-spacing="6">PERFORMANCE NUTRITION ENGINE</text>
  </g>

  <!-- Title -->
  <text x="80" y="280" font-family="Impact, Arial Black, sans-serif" font-size="160" font-weight="900" fill="#FFFFFF" letter-spacing="-4">IRON</text>
  <text x="80" y="430" font-family="Impact, Arial Black, sans-serif" font-size="160" font-weight="900" fill="#E60000" letter-spacing="-4">CALCULATOR</text>

  <!-- Tagline -->
  <text x="80" y="500" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="500" fill="#A0A0A0">Calculateur de calories &amp; macros pour sportifs.</text>

  <!-- Stats strip -->
  <g transform="translate(80, 540)">
    <rect x="0" y="0" width="280" height="50" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="20" y="32" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" letter-spacing="2">MIFFLIN-ST JEOR</text>

    <rect x="296" y="0" width="200" height="50" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="316" y="32" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" letter-spacing="2">5 NIVEAUX</text>

    <rect x="512" y="0" width="200" height="50" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="532" y="32" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" letter-spacing="2">4 OBJECTIFS</text>

    <rect x="728" y="0" width="160" height="50" fill="#E60000"/>
    <text x="748" y="32" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" letter-spacing="2">PDF EXPORT</text>
  </g>

  <!-- Logo mark top right -->
  <g transform="translate(1040, 80)">
    <rect x="0" y="0" width="80" height="80" fill="#E60000"/>
    <text x="40" y="58" font-family="Impact, Arial Black, sans-serif" font-size="48" font-weight="900" fill="#FFFFFF" text-anchor="middle">IC</text>
  </g>
</svg>
